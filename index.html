<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UeTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>LOGO</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#galeria">Galeria</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section id="inicio">
        <img src="images/person.png" altw="Image of a person">
        <h2>HELLO¡ I AM A PHOTOGRAPHER</h2>
        <a href="#galeria">View my work</a>
    </section>

    <section id="galeria">
        <div class="imagen" data-content="bosque">
            <img src="images/bosque.jpg" alt="Bosque">
        </div>
        <div class="imagen" data-content="flores">
            <img src="images/flores.jpg" alt="Flores">
        </div>
        <div class="imagen" data-content="gotas">
            <img src="images/gotas.jpg" alt="Gotas">
        </div>
        <div class="imagen" data-content="laptop">
            <img src="images/laptop.jpg" alt="Laptop">
        </div>
        <div class="imagen" data-content="libro">
            <img src="images/libro.jpg" alt="Libro">
        </div>
        <div class="imagen" data-content="montañas">
            <img src="images/montañas.jpg" alt="Montañas">
        </div>
        <div class="imagen" data-content="playa">
            <img src="images/playa.jpg" alt="Playa">
        </div>
    </section>


    <section id="contacto">
        <form class="contact-form">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre" required>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input id="correo" type="email" name="correo" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" required></textarea>
            </div>

            <button type="submit">Enviar!</button>
        </form>
    </section>

</body>

</html>
